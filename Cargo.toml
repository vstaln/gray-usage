[package]
name = "gray-usage"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "/usage: per-session token+cost accounting from the session store plus provider balance endpoints"

[lib]
name = "gray_usage"
path = "src/lib.rs"

[[bin]]
name = "gray-usage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
